<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a86f5a">
  <meta name="description" content="The Boffey Article">
  <title>The Boffey Article</title>
  <style>
    @font-face {
      font-family: "Benton Sans";
      src: url("assets/Benton%20Sans%20Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root { --paper: #e3b58f; --shadow: rgba(59, 25, 18, 0.24); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #9c6655;
      font-family: "Benton Sans", Impact, "Arial Black", sans-serif;
    }
    .hero {
      position: relative;
      width: 100%;
      height: 100svh;
      isolation: isolate;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(91, 54, 51, 0.22), rgba(211, 125, 75, 0.04)),
        url("assets/SKY_Depositphotos_43734379_ds-topaz-low%20resolution%20v2-2x-faceai%20v1%20copy.png")
        center bottom / cover no-repeat;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, rgba(60, 38, 39, 0.09), transparent 38%, rgba(117, 61, 39, 0.08));
      pointer-events: none;
    }
    .masthead {
      position: absolute;
      inset: clamp(1.1rem, 5.4vh, 4rem) auto auto clamp(1.25rem, 3.8vw, 4rem);
      z-index: 1;
      color: var(--paper);
      font-size: clamp(4.5rem, 15.2vw, 14rem);
      font-weight: 700;
      line-height: 0.74;
      letter-spacing: -0.075em;
      text-transform: uppercase;
      text-shadow: 0 0 1px var(--shadow);
      user-select: none;
    }
    .masthead span {
      display: block;
      white-space: nowrap;
      transform: scaleX(1.43);
      transform-origin: left center;
    }
    .masthead .line-two { margin-left: -0.01em; }
    .masthead .line-three { margin-left: 0.02em; }
    .headline-logo {
      position: absolute;
      z-index: 1;
      top: -69vh;
      left: 50%;
      width: auto;
      height: 180vh;
      max-width: none;
      transform: translateX(-50%);
      pointer-events: none;
      user-select: none;
    }
    .cheerleader {
      position: absolute;
      z-index: 2;
      top: -46vh;
      right: -31vw;
      width: 345vw;
      height: auto;
      filter: drop-shadow(0 1.25rem 1.6rem rgba(61, 26, 18, 0.13));
      pointer-events: none;
      user-select: none;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-aspect-ratio: 4 / 5) {
      .headline-logo {
        top: -32vh;
        left: 50%;
        width: auto;
        height: 140vh;
      }
      .masthead {
        top: 5vh;
        left: 5vw;
        font-size: clamp(4rem, 23vw, 9rem);
        line-height: 0.78;
      }
      .masthead span { white-space: normal; }
      .cheerleader {
        top: -5vh;
        right: -17vw;
        width: 465vw;
      }
    }
    @media (max-width: 520px) {
      .masthead {
        font-size: 24vw;
        letter-spacing: -0.085em;
      }
      .cheerleader { right: -24vw; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .headline-logo { animation: reveal 900ms cubic-bezier(.2,.8,.2,1) both; }
      .cheerleader { animation: float-in 1100ms 120ms cubic-bezier(.2,.8,.2,1) both; }
      @keyframes reveal {
        from { opacity: 0; transform: translate(-50%, 1.5rem); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }
      @keyframes float-in {
        from { opacity: 0; transform: translate(3rem, 2rem) rotate(1deg); }
        to { opacity: 1; transform: translate(0, 0) rotate(0); }
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <h1 class="visually-hidden">The Boffey Article</h1>
    <img class="headline-logo" src="assets/TBA%20EOK.png?v=1" alt="" aria-hidden="true">
    <img class="cheerleader" src="assets/CHEERLEADER_Depositphotos_43734379_ds-topaz-low%20resolution%20v2-2x-faceai%20v1%20copy.png" alt="">
  </main>
</body>
</html>
